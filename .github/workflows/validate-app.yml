name: Validate Application

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "src/App.jsx"
      - "src/components/**"
      - "src/hooks/**"
      - "src/lib/**"
      - "src/data/dataLoader.js"
      - "src/data/citationBundle.js"
      - "src/data/csvExport.js"
      - "src/data/releaseMeta.js"
      - "src/styles/**"
      - "tests/browser/**"
      - "tests/data/citationBundle.test.js"
      - "tests/data/urlState.test.js"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "src/App.jsx"
      - "src/components/**"
      - "src/hooks/**"
      - "src/lib/**"
      - "src/data/dataLoader.js"
      - "src/data/citationBundle.js"
      - "src/data/csvExport.js"
      - "src/data/releaseMeta.js"
      - "src/styles/**"
      - "tests/browser/**"
      - "tests/data/citationBundle.test.js"
      - "tests/data/urlState.test.js"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"

concurrency:
  group: validate-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application contracts and production build
        run: |
          npm run test:app
          npm run build
          git diff --check

      - name: Install Chromium for trust smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run citable-trust browser smoke tests
        run: npx playwright test tests/browser/chartbook.spec.js --grep "@trust"
