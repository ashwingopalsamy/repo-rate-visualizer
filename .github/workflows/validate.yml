name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check, pipeline tests, committed data (append-only against the base)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          npm run typecheck
          npm run test:pipeline
          node pipeline/publish.ts --check --base "$BASE"

  rbi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-hf-dataset.txt
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check -r requirements-hf-dataset.txt
      - name: RBI v2 data and Hugging Face datasets
        run: |
          npm run test:data
          npm run test:hf-dataset
          npm run test:release-datasets
          npm run build:hf
          git diff --exit-code -- hf || { echo "::error::hf/ is out of date with data/; run npm run build:hf and commit"; exit 1; }
          git diff --check

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: App type check, unit tests and production build
        run: |
          npm run typecheck
          npm run test:app
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser guards (layout, typography, switch smoothness, accessibility)
        run: npx playwright test
