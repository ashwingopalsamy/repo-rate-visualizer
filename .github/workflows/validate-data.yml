name: Validate RBI Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "requirements-hf-dataset.txt"
      - "scripts/**"
      - "src/data/snapshot.json"
      - "src/data/snapshotV2.js"
      - "src/data/supplementalHistory.js"
      - "hf-dataset/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "requirements-hf-dataset.txt"
      - "scripts/**"
      - "src/data/snapshot.json"
      - "src/data/snapshotV2.js"
      - "src/data/supplementalHistory.js"
      - "hf-dataset/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-hf-dataset.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Hugging Face dataset tooling
        run: python -m pip install -r requirements-hf-dataset.txt

      - name: Validate source data and dataset artifact
        run: |
          npm run test:data
          npm run test:hf-dataset
          npm run build
          git diff --check
