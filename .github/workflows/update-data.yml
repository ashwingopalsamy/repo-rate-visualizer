name: Update RBI Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 3'  # Every Wednesday at 6 AM UTC (after MPC meetings)

concurrency:
  group: update-rbi-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fetch latest RBI data
        id: fetch
        run: node scripts/fetch-rbi-data.js

      - name: Detect publishable data change
        id: changed
        run: |
          if git diff --quiet -- public/data src/data/snapshot.json src/data/releaseMeta.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publishable RBI data change detected; skipping dataset and build work."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publishable RBI data change detected."
          fi

      - uses: actions/setup-python@v7
        if: steps.changed.outputs.changed == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-hf-dataset.txt

      - name: Install Node dependencies
        if: steps.changed.outputs.changed == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Hugging Face dataset tooling
        if: steps.changed.outputs.changed == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-hf-dataset.txt

      - name: Build Hugging Face dataset artifact
        if: steps.changed.outputs.changed == 'true'
        run: python scripts/build-hf-dataset.py

      - name: Validate data, dataset artifact, and production build
        if: steps.changed.outputs.changed == 'true'
        run: |
          npm run test:data
          npm run test:hf-dataset
          npm run build
          git diff --check

      - name: Build release change report
        if: always()
        run: node scripts/build-release-report.js --output="$RUNNER_TEMP/rbi-release-report.md"

      - name: Upload release change report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbi-release-change-report
          path: ${{ runner.temp }}/rbi-release-report.md
          if-no-files-found: error

      - name: Commit if changed
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ src/data/snapshot.json src/data/releaseMeta.js hf-dataset/
          git diff --staged --quiet || git commit -m "chore(data): refresh RBI repo-rate snapshot"
          git push
