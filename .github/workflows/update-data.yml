name: Update RBI Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 3'  # Every Wednesday at 6 AM UTC (after MPC meetings)

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-hf-dataset.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Hugging Face dataset tooling
        run: python -m pip install -r requirements-hf-dataset.txt

      - name: Fetch latest RBI data
        run: node scripts/fetch-rbi-data.js

      - name: Build Hugging Face dataset artifact
        run: python scripts/build-hf-dataset.py

      - name: Validate data, dataset artifact, and production build
        run: |
          npm run test:data
          npm run test:hf-dataset
          npm run build
          git diff --check

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ src/data/snapshot.json hf-dataset/
          git diff --staged --quiet || git commit -m "chore(data): refresh RBI repo-rate snapshot"
          git push
